name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  
  IMAGE: ghcr.io/lea0375/inv-agent-cicd:latest

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'   # Django 6.1 needs Python 3.12+

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          GEMINI_API_KEY: dummy-key-for-ci   # agent.py needs the variable to exist; no real call is made
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $IMAGE .

      - name: Push Docker image
        run: docker push $IMAGE

  deploy:
    needs: test
    runs-on: [self-hosted, inventory-deploy]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check Docker on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker info

      - name: Check Docker on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker pull --platform linux/amd64 $env:IMAGE

      - name: Pull image on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: docker pull --platform linux/amd64 "$IMAGE"

      - name: Deploy on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $existing = docker ps -aq --filter "name=^/inventory-app$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($existing) {
            docker rm -f inventory-app
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          docker run -d --platform linux/amd64 --name inventory-app -e GEMINI_API_KEY -p 127.0.0.1:8000:8000 $env:IMAGE
          exit $LASTEXITCODE

      - name: Deploy on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          existing=$(docker ps -aq --filter "name=^/inventory-app$")
          if [ -n "$existing" ]; then
            docker rm -f inventory-app
          fi

          docker run -d --platform linux/amd64 --name inventory-app -e GEMINI_API_KEY -p 127.0.0.1:8000:8000 "$IMAGE"
